<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>N@XOPRO — Brand Identity</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0A0A1A; color: #F0F8FF; font-family: 'Segoe UI', sans-serif; padding: 40px 20px; }
  h1 { font-size: 13px; letter-spacing: 6px; color: #6E76A0; text-transform: uppercase; margin-bottom: 8px; }
  .brand-title { font-size: 36px; letter-spacing: 2px; margin-bottom: 40px; }
  .brand-title span { color: #2B35FF; }
  .section { margin-bottom: 50px; }
  .section-label { font-size: 10px; letter-spacing: 5px; color: #2B35FF; text-transform: uppercase; margin-bottom: 14px; border-bottom: 1px solid #2B35FF; padding-bottom: 6px; }
  img { max-width: 100%; border-radius: 4px; display: block; box-shadow: 0 8px 40px rgba(43,53,255,0.25); }
  .row { display: flex; gap: 20px; }
  .row img { flex: 1; min-width: 0; }
  .icon-wrap { display: flex; gap: 20px; align-items: flex-start; }
  .icon-wrap img { width: 160px; height: 160px; border-radius: 28px; }
</style>
</head>
<body>
  <h1>Brand Identity System</h1>
  <div class="brand-title">N<span>@</span>XOPRO</div>

  <div class="section">
    <div class="section-label">Logo — Fondo Oscuro (Principal)</div>
    <img src="logo_dark.png" alt="Logo Dark">
  </div>

  <div class="section">
    <div class="section-label">Logo — Fondo Claro</div>
    <img src="logo_light.png" alt="Logo Light">
  </div>

  <div class="section">
    <div class="section-label">Tarjeta de Presentación</div>
    <div class="row">
      <img src="card_front.png" alt="Card Front">
      <img src="card_back.png" alt="Card Back">
    </div>
  </div>

  <div class="section">
    <div class="section-label">Paleta de Colores</div>
    <img src="brand_palette.png" alt="Palette">
  </div>

  <div class="section">
    <div class="section-label">Banner Digital (LinkedIn / Web)</div>
    <img src="banner_digital.png" alt="Banner">
  </div>

  <div class="section">
    <div class="section-label">Icono / App Icon</div>
    <div class="icon-wrap">
      <img src="icon_512.png" alt="Icon">
    </div>
  </div>
</body>
</html>
