# Nginx para Filanex en DigitalOcean.
# Instalar en /etc/nginx/sites-available/filanex y enlazar a sites-enabled.

# app.filanex.es -> frontend + API en el mismo proceso (puerto 4700)
server {
    listen 80;
    server_name app.filanex.es api.filanex.es;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4700;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}
